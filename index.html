<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERS Motor Job Card</title>
<style>
  :root{
    --navy:#0f2438;
    --navy2:#173a5e;
    --accent:#e08a1e;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e8edf1;
    margin:0;
    padding:20px;
    color:#1c2833;
  }
  .app{
    max-width:960px;
    margin:0 auto;
  }
  button{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
  }
  button:hover{background:var(--navy2);}
  .toolrow{display:flex; gap:8px; margin-bottom:10px; justify-content:flex-end;}
  .status{font-size:11px;color:#556; text-align:right; margin-top:6px;}

  .card-wrap{
    background:#fff;
    border-radius:8px;
    padding:10px;
    border:1px solid #c9d3dc;
  }
  .jobcard{
    border:2.5px solid var(--navy);
    border-radius:4px;
    font-size:13px;
  }
  .jc-header{
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .jc-header h2{margin:0; font-size:18px; letter-spacing:0.5px;}
  .jc-header .sub{font-size:11px; color:#cfe0ee;}
  .jc-header .cardno{
    background:var(--accent);
    padding:5px 12px;
    border-radius:4px;
    font-weight:700;
    font-size:13px;
  }
  .jc-body{padding:16px 18px;}
  .section-title{
    background:var(--navy2);
    color:#fff;
    padding:6px 12px;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.5px;
    margin-top:10px;
  }
  .grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    border-left:1px solid #dde5eb;
    border-top:1px solid #dde5eb;
  }
  .field{
    border-right:1px solid #dde5eb;
    border-bottom:1px solid #dde5eb;
  }
  .field .lbl{
    background:#f4f7f9;
    padding:5px 10px;
    font-weight:600;
    color:var(--navy);
    font-size:11.5px;
    border-bottom:1px solid #dde5eb;
  }
  .field .val{
    padding:7px 10px;
    min-height:18px;
  }
  .field .val[contenteditable="true"]:focus{
    outline:2px solid var(--accent);
    background:#fff8ec;
  }
  footer{
    text-align:center;
    color:#7a8b99;
    font-size:11.5px;
    margin-top:10px;
  }
  @media print{
    .toolrow, .status{display:none !important;}
    body{background:#fff; padding:0;}
    .card-wrap{border:none;}
  }
</style>
</head>
<body>
lick="window.print()">🖨 Print This Card</button>
  </div>

  <div class="card-wrap">
    <div class="jobcard" id="jobcard">
      <div class="jc-header">
        <div>
          <h2>MOTOR JOB CARD</h2>
          <div class="sub">Electrical Repair Shop (ERS)</div>
        </div>
        <div class="cardno" id="cardNoDisplay">1458/26</div>
      </div>
      <div class="jc-body">

        <div class="section-title">GENERAL</div>
        <div class="grid3" id="grid-general"></div>

        <div class="section-title">MOTOR NAMEPLATE DETAILS</div>
        <div class="grid3" id="grid-nameplate"></div>

        <div class="section-title">JOB / REFERENCE DETAILS</div>
        <div class="grid3" id="grid-job"></div>

      </div>
    </div>
    <div class="status" id="status">Loading...</div>
    <footer>
Temporary Job Card System — Department of ERS | Developed & Maintained by

```
</footer>
  </div>
</div>

<script>
const GROUPS = {
  general: [
    ["department","Department"],
    ["motorNo","Motor No."],
    ["received","Received Date"]
  ],
  nameplate: [
    ["make","Motor Make"],
    ["model","Motor Model"],
    ["kw","kW"],
    ["hp","HP"],
    ["rpm","RPM"],
    ["frame","Frame"],
    ["voltage","Voltage"],
    ["phase","Phase"],
    ["hz","Hz"],
    ["current","Current (A)"],
    ["ip","IP Rating"]
  ],
  job: [
    ["agency","Agency"],
    ["jobcode","Job Code"],
    ["sap","SAP"],
    ["refid","Refurbishment ID"]
  ]
};

let card = {};

function sampleCard(){
  return {
    department: "BF-1",
    motorNo: "MTR-0001",
    received: "14/06/2026",
    make: "ABB",
    model: "M2BAX 90L",
    kw: "1.5",
    hp: "2",
    rpm: "1440",
    frame: "90L",
    voltage: "415 V",
    phase: "3-P",
    hz: "50",
    current: "3.2",
    ip: "IP55",
    agency: "KV",
    jobcode: "1458/26",
    sap: "SAP-10001",
    refid: "REF-001"
  };
}

function buildGrid(containerId, groupKey){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  GROUPS[groupKey].forEach(([key, label]) => {
    const field = document.createElement('div');
    field.className = 'field';
    field.innerHTML = `<div class="lbl">${label}</div><div class="val" contenteditable="true" onblur="updateField('${key}', this.innerText)">${card[key] || ""}</div>`;
    container.appendChild(field);
  });
}

function renderCard(){
  document.getElementById('cardNoDisplay').innerText = card.jobcode || "JOB-000";
  buildGrid('grid-general','general');
  buildGrid('grid-nameplate','nameplate');
  buildGrid('grid-job','job');
}

function updateField(field, value){
  card[field] = value.trim ? value.trim() : value;
  if(field === 'jobcode'){
    document.getElementById('cardNoDisplay').innerText = card.jobcode || "JOB-000";
  }
}

function setStatus(msg){
  document.getElementById('status').innerText = msg;
}

async function saveData(){
  try{
    const result = await window.storage.set('motor-job-card-single', JSON.stringify(card), false);
    if(result){
      setStatus("Saved ✓ (" + new Date().toLocaleTimeString() + ")");
    } else {
      setStatus("Save failed - try again");
    }
  }catch(e){
    setStatus("Save error: " + e.message);
  }
}

async function loadData(){
  try{
    const result = await window.storage.get('motor-job-card-single', false);
    if(result && result.value){
      card = JSON.parse(result.value);
    } else {
      card = sampleCard();
    }
  }catch(e){
    card = sampleCard();
  }
  renderCard();
  setStatus("");
}

loadData();
</script>
</body>
</html>
