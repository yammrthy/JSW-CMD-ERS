<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ERS Motor Job Card</title>

<style>
  :root{
    --navy:#0f2438;
    --navy2:#173a5e;
    --accent:#e08a1e;
    --border:#dde5eb;
    --light:#f4f7f9;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
  }

  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e8edf1;
    color:#1c2833;

    /* Center the application */
    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:20px;
  }

  /* Main application wrapper */
  .app{
    width:100%;
    max-width:960px;
    margin:0 auto;
  }

  /* Buttons */
  button{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
  }

  button:hover{
    background:var(--navy2);
  }

  .toolrow{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    justify-content:flex-end;
    flex-wrap:wrap;
  }

  .status{
    font-size:11px;
    color:#556;
    text-align:right;
    margin-top:6px;
    min-height:15px;
  }

  /* Outer white container */
  .card-wrap{
    width:100%;
    background:#fff;
    border-radius:8px;
    padding:10px;
    border:1px solid #c9d3dc;
  }

  /* Main job card */
  .jobcard{
    width:100%;
    border:2.5px solid var(--navy);
    border-radius:4px;
    font-size:13px;
    overflow:hidden;
    background:#fff;
  }

  /* Header */
  .jc-header{
    background:var(--navy);
    color:#fff;

    padding:10px 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
  }

  .jc-header h2{
    margin:0;
    font-size:18px;
    letter-spacing:.5px;
  }

  .jc-header .sub{
    font-size:11px;
    color:#cfe0ee;
    margin-top:2px;
  }

  .jc-header .cardno{
    background:var(--accent);
    padding:5px 12px;
    border-radius:4px;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
  }

  /* Body */
  .jc-body{
    padding:16px 18px;
  }

  /* Section headings */
  .section-title{
    background:var(--navy2);
    color:#fff;

    padding:6px 12px;

    font-weight:700;
    font-size:12.5px;
    letter-spacing:.5px;

    margin-top:10px;
  }

  .section-title:first-child{
    margin-top:0;
  }

  /* Field grid */
  .grid3{
    display:grid;

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

    border-left:1px solid var(--border);
    border-top:1px solid var(--border);
  }

  /* Individual field */
  .field{
    min-width:0;

    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }

  .field .lbl{
    background:var(--light);

    padding:5px 10px;

    font-weight:600;
    color:var(--navy);
    font-size:11.5px;

    border-bottom:1px solid var(--border);
  }

  .field .val{
    padding:7px 10px;

    min-height:34px;

    word-break:break-word;
    overflow-wrap:anywhere;

    background:#fff;
  }

  /* Editable field */
  .field .val[contenteditable="true"]{
    cursor:text;
  }

  .field .val[contenteditable="true"]:focus{
    outline:2px solid var(--accent);
    outline-offset:-2px;

    background:#fff8ec;
  }

  /* Footer */
  footer{
    text-align:center;
    color:#7a8b99;

    font-size:11.5px;

    margin-top:10px;

    line-height:1.5;
  }

  footer a{
    color:var(--navy2);
    text-decoration:none;
  }

  footer a:hover{
    text-decoration:underline;
  }


  /* =========================================
     TABLET
     ========================================= */

  @media (max-width:768px){

    body{
      padding:12px;
    }

    .card-wrap{
      max-width:700px;
    }

    .jc-body{
      padding:12px;
    }

    /* Two columns on tablets */
    .grid3{
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .jc-header{
      padding:10px 12px;
    }

    .jc-header h2{
      font-size:16px;
    }
  }


  /* =========================================
     MOBILE
     ========================================= */

  @media (max-width:480px){

    body{
      padding:6px;

      background:#fff;

      /* Keep card centered */
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:100%;
    }

    .card-wrap{
      width:100%;

      padding:0;

      border:none;
      border-radius:0;
    }

    .jobcard{
      width:100%;

      border-width:2px;
      border-radius:3px;
    }

    /* Compact header */
    .jc-header{
      padding:9px 10px;

      gap:8px;
    }

    .jc-header h2{
      font-size:14px;
      letter-spacing:.3px;
    }

    .jc-header .sub{
      font-size:9px;
    }

    .jc-header .cardno{
      padding:4px 7px;
      font-size:11px;
    }

    /* Compact body */
    .jc-body{
      padding:8px;
    }

    /* One field per row on phones */
    .grid3{
      grid-template-columns:1fr;
    }

    .section-title{
      margin-top:8px;

      padding:6px 8px;

      font-size:11px;
    }

    .field .lbl{
      padding:5px 8px;

      font-size:10.5px;
    }

    .field .val{
      padding:8px;

      min-height:36px;

      font-size:12px;
    }

    .status{
      font-size:10px;
    }

    footer{
      font-size:9.5px;

      padding:0 5px;
    }
  }


  /* =========================================
     VERY SMALL PHONES
     ========================================= */

  @media (max-width:360px){

    body{
      padding:3px;
    }

    .jc-header{
      padding:8px;
    }

    .jc-header h2{
      font-size:13px;
    }

    .jc-header .sub{
      font-size:8px;
    }

    .jc-header .cardno{
      font-size:10px;
      padding:3px 6px;
    }

    .jc-body{
      padding:6px;
    }

    .section-title{
      font-size:10px;
    }

    .field .lbl{
      font-size:10px;
    }

    .field .val{
      font-size:11.5px;
    }
  }


  /* =========================================
     PRINT
     ========================================= */

  @media print{

    .toolrow,
    .status{
      display:none !important;
    }

    body{
      background:#fff;
      padding:0;

      display:block;
    }

    .app{
      max-width:none;
    }

    .card-wrap{
      border:none;
      padding:0;
    }

    .jobcard{
      border:2px solid var(--navy);
    }
  }

</style>
</head>


<body>

<div class="app">

  <!-- JOB CARD -->
  <div class="card-wrap">

    <div class="jobcard" id="jobcard">

      <!-- HEADER -->
      <div class="jc-header">

        <div>
          <h2>MOTOR JOB CARD</h2>

          <div class="sub">
            Electrical Repair Shop (ERS)
          </div>
        </div>

        <div class="cardno" id="cardNoDisplay">
          1458/26
        </div>

      </div>


      <!-- BODY -->
      <div class="jc-body">

        <!-- GENERAL -->
        <div class="section-title">
          GENERAL
        </div>

        <div class="grid3" id="grid-general"></div>


        <!-- NAMEPLATE -->
        <div class="section-title">
          MOTOR NAMEPLATE DETAILS
        </div>

        <div class="grid3" id="grid-nameplate"></div>


        <!-- JOB -->
        <div class="section-title">
          JOB / REFERENCE DETAILS
        </div>

        <div class="grid3" id="grid-job"></div>

      </div>

    </div>


    <!-- STATUS -->
    <div class="status" id="status">
      Loading...
    </div>


    <!-- FOOTER -->
    <footer>
      Temporary Job Card System — Department of ERS
      <br>
      Developed &amp; Maintained by
      <a href="mailto:yamuna.m@jsw.in">
        Yamuna Moorthy
      </a>
    </footer>

  </div>

</div>


<script>

  /* =========================================
     FIELD GROUPS
     ========================================= */

  const GROUPS = {

    general: [

      ["department", "Department"],

      ["motorNo", "Motor No."],

      ["received", "Received Date"]

    ],


    nameplate: [

      ["make", "Motor Make"],

      ["model", "Motor Model"],

      ["kw", "kW"],

      ["hp", "HP"],

      ["rpm", "RPM"],

      ["frame", "Frame"],

      ["voltage", "Voltage"],

      ["phase", "Phase"],

      ["hz", "Hz"],

      ["current", "Current (A)"],

      ["ip", "IP Rating"]

    ],


    job: [

      ["agency", "Agency"],

      ["jobcode", "Job Code"],

      ["sap", "SAP"],

      ["refid", "Refurbishment ID"]

    ]

  };


  /* =========================================
     CURRENT CARD DATA
     ========================================= */

  let card = {};


  /* =========================================
     SAMPLE DATA
     ========================================= */

  function sampleCard(){

    return {

      department: "BF-1",

      motorNo: "MTR-0001",

      received: "14/06/2026",

      make: "ABB",

      model: "M2BAX 90L",

      kw: "1.5",

      hp: "2",

      rpm: "1440",

      frame: "90L",

      voltage: "415 V",

      phase: "3-P",

      hz: "50",

      current: "3.2",

      ip: "IP55",

      agency: "KV",

      jobcode: "1458/26",

      sap: "SAP-10001",

      refid: "REF-001"

    };

  }


  /* =========================================
     BUILD GRID
     ========================================= */

  function buildGrid(containerId, groupKey){

    const container =
      document.getElementById(containerId);

    container.innerHTML = "";


    GROUPS[groupKey].forEach(
      ([key, label]) => {

        const field =
          document.createElement("div");

        field.className = "field";


        const labelDiv =
          document.createElement("div");

        labelDiv.className = "lbl";

        labelDiv.innerText = label;


        const valueDiv =
          document.createElement("div");

        valueDiv.className = "val";

        valueDiv.contentEditable = "true";

        valueDiv.spellcheck = false;

        valueDiv.innerText = card[key] || "";


        /*
         * Save the value when
         * the user leaves the field.
         */

        valueDiv.addEventListener(
          "blur",
          function(){

            updateField(
              key,
              this.innerText
            );

          }
        );


        /*
         * Save using Enter.
         * Prevents creating additional lines.
         */

        valueDiv.addEventListener(
          "keydown",
          function(event){

            if(event.key === "Enter"){

              event.preventDefault();

              this.blur();

            }

          }
        );


        field.appendChild(labelDiv);

        field.appendChild(valueDiv);

        container.appendChild(field);

      }
    );

  }


  /* =========================================
     RENDER CARD
     ========================================= */

  function renderCard(){

    document.getElementById(
      "cardNoDisplay"
    ).innerText =
      card.jobcode || "JOB-000";


    buildGrid(
      "grid-general",
      "general"
    );


    buildGrid(
      "grid-nameplate",
      "nameplate"
    );


    buildGrid(
      "grid-job",
      "job"
    );

  }


  /* =========================================
     UPDATE FIELD
     ========================================= */

  function updateField(field, value){

    card[field] =
      value.trim
        ? value.trim()
        : value;


    /*
     * Update the orange job number
     * whenever Job Code changes.
     */

    if(field === "jobcode"){

      document.getElementById(
        "cardNoDisplay"
      ).innerText =
        card.jobcode || "JOB-000";

    }


    /*
     * Automatically save if
     * storage is available.
     */

    saveData();

  }


  /* =========================================
     STATUS
     ========================================= */

  function setStatus(msg){

    document.getElementById(
      "status"
    ).innerText = msg;

  }


  /* =========================================
     SAVE DATA
     ========================================= */

  async function saveData(){

    try{

      /*
       * window.storage is used by the
       * original application environment.
       */

      if(
        typeof window.storage === "undefined"
      ){

        localStorage.setItem(
          "motor-job-card-single",
          JSON.stringify(card)
        );

        setStatus(
          "Saved ✓ " +
          new Date().toLocaleTimeString()
        );

        return;

      }


      const result =
        await window.storage.set(
          "motor-job-card-single",
          JSON.stringify(card),
          false
        );


      if(result){

        setStatus(
          "Saved ✓ (" +
          new Date().toLocaleTimeString() +
          ")"
        );

      }
      else{

        setStatus(
          "Save failed - try again"
        );

      }

    }
    catch(e){

      /*
       * Fallback to browser localStorage.
       */

      try{

        localStorage.setItem(
          "motor-job-card-single",
          JSON.stringify(card)
        );

        setStatus(
          "Saved ✓ " +
          new Date().toLocaleTimeString()
        );

      }
      catch(error){

        setStatus(
          "Save error: " +
          e.message
        );

      }

    }

  }


  /* =========================================
     LOAD DATA
     ========================================= */

  async function loadData(){

    try{

      /*
       * First try the original storage.
       */

      if(
        typeof window.storage !== "undefined"
      ){

        const result =
          await window.storage.get(
            "motor-job-card-single",
            false
          );


        if(
          result &&
          result.value
        ){

          card =
            JSON.parse(result.value);

        }
        else{

          card = sampleCard();

        }

      }

      else{

        /*
         * Browser fallback.
         */

        const saved =
          localStorage.getItem(
            "motor-job-card-single"
          );


        if(saved){

          card = JSON.parse(saved);

        }
        else{

          card = sampleCard();

        }

      }

    }
    catch(e){

      /*
       * If loading fails,
       * use sample data.
       */

      try{

        const saved =
          localStorage.getItem(
            "motor-job-card-single"
          );


        if(saved){

          card = JSON.parse(saved);

        }
        else{

          card = sampleCard();

        }

      }
      catch(error){

        card = sampleCard();

      }

    }


    renderCard();

    setStatus("");

  }


  /* =========================================
     START APPLICATION
     ========================================= */

  loadData();

</script>

</body>
</html>
